services:
  - type: web
    name: virtual-tour-presence
    runtime: node
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: GUIDE_PASSCODE
        sync: false

  - type: web
    name: virtual-tour-smkn2
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /models/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300
      - path: /index.html
        name: Cache-Control
        value: no-cache
